# template.toml -- what this template ships, and how each file is kept in sync
# with the projects created from it. Read by scripts/template_sync.py, which
# never ships to children; see that script's docstring for the mechanics.
#
#   managed  the template owns it; local edits are drift (an error)
#   merge    both sides edit it; 3-way merged on update, conflicts left as markers
#   seed     copied once by `new`, then never looked at again
#   exclude  never leaves this repo
#
# Every tracked file must fall under exactly one rule -- `make template-validate`
# enforces it, so adding a file forces a decision here.

# The version of the format this file, and the markers in the template's files,
# are written in; see MANIFEST_FORMAT in scripts/template_sync.py.
manifest_format = 2

# Tracked here, never shipped. (A bare key like this must precede every [table].)
exclude = [
  "template.toml",
  "scripts/template_sync.py",
  "scripts/template_sync_test.py",
  "README.md",                # the template's own README and documentation site;
  "docs/*.md",                # children get the generic ones in child/ instead
]

# Literal in this repo -> key in a child's .template.toml [values]. Substituted in
# file contents and in paths. `new` defaults `project` to the child's directory
# name and every other key to the literal itself (so an unset placeholder stays a
# visible placeholder).
[tokens]
"scad-repo-template" = "project"
"<COPYRIGHT HOLDER>" = "copyright_holder"

# Template directory -> the directory its files land in, in a child. child/ holds
# what children get in place of the template's own files: child/README.md becomes
# a child's README.md, child/docs/index.md its docs/index.md.
[paths]
"child/" = ""

[base]
managed = [
  ".github/workflows/render.yml",
  ".gitignore",
  ".gitmodules",
  ".pre-commit-config.yaml",
]
merge = [
  "AGENTS.md",                # projects add their own rules
  "CLAUDE.md",                # imports AGENTS.md; projects may add to it
  "Makefile",                 # projects add their own targets, e.g. for variants
]
seed = [
  "LICENSE",
  "child/README.md",          # generic, for each project to rewrite
  "docs/preview.png",         # the README's image, so shipped with or without docs
  "src/lib/common.scad",
  "scripts/.gitkeep",
  "src/*.scad",
  "tests/common.scad",
]

# Optional features: [features.<name>] tables with the same managed/merge/seed
# lists, plus `description`, `default` (true) and `requires = [...]`. `new` asks
# about each; a child records its choices in its .template.toml [features]. A
# declined feature's files are not tracked and its <template-only feature="name">
# blocks are stripped; <template-only feature="!name"> blocks are stripped from
# children that take it instead.

[features.docs]
description = "an MkDocs site, published to GitHub Pages; otherwise the README is the documentation"
default = false
managed = [
  ".github/workflows/docs.yml",
  "pyproject.toml",           # the MkDocs toolchain
  "uv.lock",
]
merge = [
  "mkdocs.yml",               # projects add pages to nav
]
seed = [
  "child/docs/*.md",          # generic Home, Getting started and Development pages
]
